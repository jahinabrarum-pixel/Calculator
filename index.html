/* ═══════════════════════════════════════════════
   BASE RESET & LAYOUT
═══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg-root);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Share Tech Mono', monospace;
  transition: background 0.4s ease;
  overflow-x: hidden;
  position: relative;
  padding: clamp(10px, 3vw, 40px);
  -webkit-tap-highlight-color: transparent;
}

/* Animated background grid */
.bg-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: clamp(20px,4vw,40px) clamp(20px,4vw,40px);
  animation: gridDrift 25s linear infinite;
  transition: background-image 0.4s;
}
@keyframes gridDrift { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }

/* Background orbs */
.bg-orbs {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 55vw 40vh at 15% 50%, var(--orb1) 0%, transparent 70%),
    radial-gradient(ellipse 45vw 55vh at 85% 20%, var(--orb2) 0%, transparent 70%),
    radial-gradient(ellipse 35vw 35vh at 60% 80%, var(--orb3) 0%, transparent 70%);
  transition: background 0.5s;
}

/* Particles canvas */
#particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

/* ═══════════════════════════════════════════════
   THEME TOGGLE PANEL  (advanced)
═══════════════════════════════════════════════ */
.theme-panel {
  position: fixed;
  top: clamp(10px,2vw,20px);
  right: clamp(10px,2vw,20px);
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

/* Main toggle button */
.toggle-btn {
  position: relative;
  width: clamp(52px,8vw,64px);
  height: clamp(28px,4vw,34px);
  background: var(--toggle-track);
  border: 1px solid var(--toggle-track-border);
  border-radius: 999px;
  cursor: pointer;
  outline: none;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.toggle-btn:hover { box-shadow: 0 2px 16px rgba(0,0,0,0.4), var(--glow-a); }
.toggle-knob {
  position: absolute;
  top: 3px; left: 3px;
  width: calc(clamp(28px,4vw,34px) - 8px);
  height: calc(clamp(28px,4vw,34px) - 8px);
  border-radius: 50%;
  background: var(--toggle-knob-bg);
  box-shadow: var(--toggle-knob-shadow);
  transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), background 0.3s, box-shadow 0.3s;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}
[data-theme="light"] .toggle-knob { transform: translateX(calc(clamp(52px,8vw,64px) - clamp(28px,4vw,34px))); }

/* Theme picker dropdown */
.theme-picker {
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0;
  transform: translateY(-8px) scale(0.95);
  pointer-events: none;
  transition: all 0.25s cubic-bezier(.34,1.3,.64,1);
  min-width: 130px;
}
.theme-picker.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.theme-picker-label {
  font-size: 8px;
  letter-spacing: 0.35em;
  color: var(--text-dim);
  text-align: center;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}
.theme-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 7px;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  transition: all 0.18s;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-main);
  letter-spacing: 0.15em;
  outline: none;
  width: 100%;
  text-align: left;
}
.theme-opt:hover { background: var(--bg-btn-h); border-color: var(--border-h); }
.theme-opt.active { border-color: var(--accent-a); color: var(--accent-a); background: var(--op-bg); }
.theme-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}

/* ═══════════════════════════════════════════════
   WRAPPER & HEADER
═══════════════════════════════════════════════ */
.wrapper {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center;
  gap: clamp(8px,1.5vh,16px);
  width: 100%;
  max-width: 460px;
}

.header {
  text-align: center;
  letter-spacing: 0.35em;
}
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(16px,4.5vw,28px);
  background: linear-gradient(90deg, var(--accent-a), var(--accent-b), var(--accent-a));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s linear infinite;
  filter: var(--header-glow);
  transition: filter 0.4s;
}
@keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
.header-sub {
  font-size: clamp(7px,1.5vw,9px);
  color: var(--text-dim);
  letter-spacing: 0.5em;
  margin-top: 3px;
  transition: color 0.4s;
}

/* ═══════════════════════════════════════════════
   CALCULATOR CARD
═══════════════════════════════════════════════ */
.calc {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: clamp(14px,3vw,22px);
  padding: clamp(12px,2.5vw,22px);
  width: 100%;
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
}

/* Corner decorators */
.corner { position: absolute; width: clamp(20px,4vw,30px); height: clamp(20px,4vw,30px); }
.corner-tl { top: 8px; left: 8px;  border-top: 2px solid var(--corner-color); border-left: 2px solid var(--corner-color); border-radius: 5px 0 0 0; }
.corner-tr { top: 8px; right: 8px; border-top: 2px solid var(--corner-color); border-right: 2px solid var(--corner-color); border-radius: 0 5px 0 0; }
.corner-bl { bottom: 8px; left: 8px;  border-bottom: 2px solid var(--corner-color); border-left: 2px solid var(--corner-color); border-radius: 0 0 0 5px; }
.corner-br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--corner-color); border-right: 2px solid var(--corner-color); border-radius: 0 0 5px 0; }

/* ═══ Status bar ═══ */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: clamp(8px,1.5vh,12px);
  padding: 0 2px;
}
.dots { display: flex; gap: 5px; align-items: center; }
.dot {
  width: clamp(5px,1.2vw,7px); height: clamp(5px,1.2vw,7px);
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}
.dot-g { background: var(--status-live); box-shadow: 0 0 7px var(--status-live); }
.dot-b { background: var(--accent-b); box-shadow: 0 0 7px var(--accent-b); animation-delay: 0.6s; }
.dot-a { background: var(--accent-a); box-shadow: 0 0 7px var(--accent-a); animation-delay: 1.2s; }
@keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.35;transform:scale(0.65)} }
.status-text { font-size: clamp(7px,1.4vw,9px); color: var(--text-dim); letter-spacing: 0.25em; transition: color 0.3s; }
.mode-tag {
  font-size: clamp(7px,1.4vw,9px);
  color: var(--accent-a);
  border: 1px solid var(--op-border);
  padding: 2px clamp(5px,1.2vw,8px);
  border-radius: 999px;
  letter-spacing: 0.2em;
  transition: all 0.3s;
}

/* ═══ Display ═══ */
.display {
  background: var(--bg-display);
  border: 1px solid var(--border);
  border-radius: clamp(8px,2vw,14px);
  padding: clamp(10px,2vw,16px) clamp(12px,2.5vw,18px);
  margin-bottom: clamp(8px,1.5vh,14px);
  position: relative;
  min-height: clamp(85px,15vh,120px);
  overflow: hidden;
  box-shadow: var(--display-glow);
  transition: all 0.4s;
}
.display::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg,transparent,var(--accent-a),transparent);
  opacity: 0.4;
}
.display::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,var(--scanline) 3px,var(--scanline) 4px);
  pointer-events: none; border-radius: inherit;
  transition: background 0.4s;
}
.expression {
  font-size: clamp(9px,1.8vw,12px);
  color: var(--text-expr);
  text-align: right;
  min-height: clamp(16px,3vh,22px);
  letter-spacing: 0.08em;
  word-break: break-all;
  margin-bottom: clamp(4px,1vh,8px);
  transition: color 0.4s;
  font-family: 'Exo 2', sans-serif;
}
.result {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(24px,7vw,42px);
  font-weight: 700;
  text-align: right;
  color: var(--text-main);
  letter-spacing: 0.04em;
  text-shadow: 0 0 18px rgba(0,229,255,0.2);
  transition: color 0.3s, font-size 0.2s, text-shadow 0.4s;
  word-break: break-all;
  line-height: 1.1;
}
.result.err  { color: var(--accent-d) !important; font-size: clamp(16px,4vw,22px); }
.result.flash { animation: displayFlash 0.18s ease; }
@keyframes displayFlash {
  0%{opacity:1} 50%{opacity:0.25; color: var(--accent-a)} 100%{opacity:1}
}

/* ═══ Memory chips ═══ */
.chips {
  display: flex; gap: clamp(4px,1vw,7px);
  margin-bottom: clamp(8px,1.5vh,12px);
  flex-wrap: wrap;
}
.chip {
  font-size: clamp(7px,1.3vw,9px);
  color: var(--text-dim);
  border: 1px solid var(--chip-border);
  border-radius: 999px;
  padding: clamp(2px,0.5vh,3px) clamp(6px,1.2vw,10px);
  letter-spacing: 0.2em;
  transition: all 0.25s;
  cursor: default;
  background: transparent;
  font-family: 'Share Tech Mono', monospace;
}
.chip.on {
  color: var(--chip-active-color);
  border-color: var(--chip-active-border);
  box-shadow: var(--chip-active-shadow);
}

/* ═══ Button grid ═══ */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(5px,1.2vw,9px);
}

/* ═══ Buttons ═══ */
.btn {
  position: relative;
  height: clamp(44px,8.5vh,64px);
  border: 1px solid var(--border);
  border-radius: clamp(7px,1.5vw,11px);
  background: var(--bg-btn);
  color: var(--text-main);
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(11px,2.2vw,15px);
  cursor: pointer;
  transition: all 0.14s ease;
  overflow: hidden;
  outline: none;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.04em;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 60%);
  pointer-events: none;
}
.btn:hover {
  background: var(--bg-btn-h);
  border-color: var(--border-h);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.35), var(--glow-a);
}
.btn:active { transform: scale(0.94) translateY(1px); box-shadow: none !important; }

/* Ripple */
.rip {
  position: absolute; border-radius: 50%;
  transform: scale(0);
  animation: rip 0.4s linear;
  background: rgba(255,255,255,0.12);
  pointer-events: none;
}
@keyframes rip { to { transform: scale(4); opacity: 0; } }

/* Button variants */
.btn.op {
  color: var(--op-color);
  border-color: var(--op-border);
  background: var(--op-bg);
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(13px,2.5vw,18px);
}
.btn.op:hover { background: var(--op-bg-h); border-color: var(--accent-a); box-shadow: var(--glow-a); }
.btn.op.active-op { background: var(--op-bg-h); border-color: var(--accent-a); box-shadow: var(--glow-a); }

.btn.eq {
  background: var(--eq-bg);
  border-color: var(--accent-b);
  color: #fff;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(16px,3vw,22px);
  font-weight: 700;
  box-shadow: var(--eq-shadow);
  grid-column: span 4;
}
.btn.eq:hover { filter: brightness(1.15); transform: translateY(-2px); box-shadow: var(--eq-shadow), 0 6px 20px rgba(0,0,0,0.4); }

.btn.clr {
  color: var(--clr-color);
  border-color: var(--clr-border);
  background: var(--clr-bg);
}
.btn.clr:hover { background: var(--clr-bg-h); border-color: var(--clr-color); box-shadow: var(--glow-d); }

.btn.fn {
  color: var(--fn-color);
  border-color: var(--fn-border);
  background: var(--fn-bg);
  font-size: clamp(9px,1.8vw,12px);
}
.btn.fn:hover { background: var(--fn-bg-h); border-color: var(--fn-color); box-shadow: var(--fn-glow); }

.btn.mem {
  color: var(--mem-color);
  border-color: var(--mem-border);
  background: var(--mem-bg);
  font-size: clamp(9px,1.8vw,12px);
}
.btn.mem:hover { background: var(--mem-bg-h); border-color: var(--mem-color); box-shadow: var(--glow-c); }

.btn.num:hover { background: var(--num-bg-h); border-color: var(--border-h); }

.btn.back { color: var(--back-color); font-size: clamp(14px,2.5vw,20px); }
.btn.zero { grid-column: span 2; }

/* ═══ Footer ═══ */
.footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: clamp(10px,1.5vh,16px);
  padding: 0 3px;
}
.ft { font-size: clamp(7px,1.3vw,9px); color: var(--footer-color); letter-spacing: 0.25em; transition: color 0.4s; }

/* ═══════════════════════════════════════════════
   17 BREAKPOINTS — from 240px to 2560px
═══════════════════════════════════════════════ */

/* 240px — tiny smartwatch */
@media (max-width: 259px) {
  .wrapper { max-width: 220px; gap: 5px; }
  .calc { padding: 8px; border-radius: 10px; }

  .btn-grid { gap: 4px; }
  .result { font-size: 20px; }

  .chips { display: none; }
}

}

@media (min-width: 300px) and (max-width: 339px) {

}

/* 340px */
@media (min-width: 340px) and (max-width: 374px) {
  .wrapper { max-width: 330px; }

}

/* 375px — iPhone SE/standard */
@media (min-width: 375px) and (max-width: 413px) {
  .wrapper { max-width: 360px; }
  .btn { height: 48px; }
  .result { font-size: 28px; }
}

/* 414px — iPhone Plus / large phones */
@media (min-width: 414px) and (max-width: 479px) {
  .wrapper { max-width: 400px; }
  .btn { height: 50px; }

}

/* 480px — small tablets portrait */
@media (min-width: 480px) and (max-width: 567px) {
  .wrapper { max-width: 460px; }

}

/* 568px — iPhone SE landscape */
@media (min-width: 568px) and (max-width: 639px) {
  .wrapper { max-width: 520px; }
  .btn { height: 50px; }
}

/* 640px — small tablet landscape / large phone landscape */
@media (min-width: 640px) and (max-width: 767px) {
  .wrapper { max-width: 560px; }
  .calc { padding: 18px; }
  .btn { height: 52px; font-size: 14px; }
  .result { font-size: 36px; }
}

/* 768px — tablet portrait (iPad) */
@media (min-width: 768px) and (max-width: 1023px) {
  .wrapper { max-width: 480px; }
  .calc { padding: 20px; }
  .btn { height: 58px; font-size: 15px; border-radius: 11px; }
  .btn-grid { gap: 8px; }

}

/* 1024px — iPad landscape / small laptop */
@media (min-width: 1024px) and (max-width: 1199px) {
  .wrapper { max-width: 430px; }
  .btn { height: 56px; }
  .result { font-size: 38px; }
}

/* 1200px — laptop */
@media (min-width: 1200px) and (max-width: 1365px) {
  .wrapper { max-width: 420px; }
  .calc { padding: 22px; }
  .btn { height: 58px; }
  .result { font-size: 40px; }
}

/* 1366px — HD laptop (common 13/14") */
@media (min-width: 1366px) and (max-width: 1439px) {
  .wrapper { max-width: 430px; }
  .btn { height: 60px; font-size: 15px; }
  .result { font-size: 42px; }
}

/* 1440px — MacBook Pro 14" / most laptops */
@media (min-width: 1440px) and (max-width: 1679px) {
  .wrapper { max-width: 440px; }
  .btn { height: 62px; font-size: 15px; }
  .result { font-size: 44px; }
}

/* 1680px — larger laptop/monitor */
@media (min-width: 1680px) and (max-width: 1919px) {
  .wrapper { max-width: 460px; }
  .calc { padding: 24px; }
  .btn { height: 64px; font-size: 16px; border-radius: 12px; }
  .btn-grid { gap: 10px; }
  .result { font-size: 46px; }
}

/* 1920px — Full HD monitor */
@media (min-width: 1920px) and (max-width: 2559px) {
  .wrapper { max-width: 500px; }
  .calc { padding: 26px; border-radius: 24px; }
  .btn { height: 68px; font-size: 17px; border-radius: 13px; }
  .btn-grid { gap: 11px; }
  .result { font-size: 50px; }
  .header-title { font-size: 30px; }
  .display { min-height: 130px; }
}

/* 2560px — 2K / QHD / 27" monitor */
@media (min-width: 2560px) {
  html { font-size: 20px; }
  .wrapper { max-width: 600px; }
  .calc { padding: 32px; border-radius: 28px; }
  .btn { height: 80px; font-size: 19px; border-radius: 15px; }

  .display { min-height: 150px; padding: 20px 22px; }
  .theme-panel { top: 28px; right: 28px; }
  .toggle-btn { width: 72px; height: 38px; }
}

/* Landscape on small screens — compress vertically */
@media (max-height: 500px) and (orientation: landscape) {
  body { padding: 6px; justify-content: flex-start; }
  .wrapper { gap: 5px; }
  .header { display: none; }
  .display { min-height: 70px; }
  .btn { height: 40px; }
  .btn-grid { gap: 4px; }
  .chips { display: none; }
  .footer { margin-top: 6px; }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.1ms !important; }
}

<script>
/* ═══════════════════════════════════════════
   PARTICLE SYSTEM
═══════════════════════════════════════════ */
(function(){
  const cvs = document.getElementById('particles');
  const ctx = cvs.getContext('2d');
  let W, H, pts = [];

  function resize(){
    W = cvs.width  = window.innerWidth;
    H = cvs.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function getColor(){
    const t = document.documentElement.getAttribute('data-theme');
    const map = {
      dark:   ['#00e5ff','#2979ff','#00e676'],
      light:  ['#0077cc','#1155ee','#008844'],
      neon:   ['#ff00ff','#00ffff','#00ff88'],
      amber:  ['#ffaa00','#ff8800','#ffcc44'],
      matrix: ['#00ff41','#00dd33','#88ff88']
    };
    const arr = map[t] || map.dark;
    return arr[Math.floor(Math.random()*arr.length)];
  }

  for(let i=0; i<40; i++) pts.push({
    x: Math.random()*2000, y: Math.random()*1200,
    vx: (Math.random()-.5)*0.4, vy: -0.3-Math.random()*0.5,
    r: 0.5+Math.random()*1.5,
    a: 0, life: Math.random(),
    color: getColor()
  });

  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.life += 0.004;
      if(p.life>1){ p.life=0; p.x=Math.random()*W; p.y=H+10; p.color=getColor(); }
      const op = p.life<0.1 ? p.life*10 : p.life>0.9 ? (1-p.life)*10 : 1;
      ctx.beginPath();
      ctx.arc(p.x%W, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = op * 0.6;
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ═══════════════════════════════════════════
   THEME SYSTEM
═══════════════════════════════════════════ */
const themes = ['dark','light','neon','amber','matrix'];
const knobIcons = { dark:'☽', light:'☀', neon:'⚡', amber:'◈', matrix:'⬡' };
let pickerOpen = false;

const html       = document.documentElement;
const toggleBtn  = document.getElementById('toggleBtn');
const toggleKnob = document.getElementById('toggleKnob');
const themePicker= document.getElementById('themePicker');

function applyTheme(t){
  html.setAttribute('data-theme', t);
  toggleKnob.textContent = knobIcons[t] || '●';
  localStorage.setItem('nx-theme', t);
  document.querySelectorAll('.theme-opt').forEach(o=>{
    o.classList.toggle('active', o.dataset.t === t);
  });
}

// Load saved theme
applyTheme(localStorage.getItem('nx-theme') || 'dark');

toggleBtn.addEventListener('click', e => {
  e.stopPropagation();
  pickerOpen = !pickerOpen;
  themePicker.classList.toggle('open', pickerOpen);
});

document.querySelectorAll('.theme-opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    applyTheme(opt.dataset.t);
    pickerOpen = false;
    themePicker.classList.remove('open');
  });
});

document.addEventListener('click', ()=>{
  if(pickerOpen){ pickerOpen=false; themePicker.classList.remove('open'); }
});

/* ═══════════════════════════════════════════
   CLOCK

(function(){
  const el = document.getElementById('clockEl');
  function tick(){
    const n = new Date();
    el.textContent = [n.getHours(),n.getMinutes(),n.getSeconds()]

   RIPPLE

document.querySelectorAll('.btn').forEach(btn=>{
  btn.addEventListener('pointerdown', e=>{
    const r = document.createElement('span');
    r.className = 'rip';
    const rc = btn.getBoundingClientRect();

    setTimeout(()=>r.remove(), 500);

/* ═══════════════════════════════════════════
   CALCULATOR ENGINE
═══════════════════════════════════════════ */
const resultEl = document.getElementById('resultEl');
const exprEl   = document.getElementById('exprEl');
const statusEl = document.getElementById('statusEl');
const modeEl   = document.getElementById('modeEl');
const chipM    = document.getElementById('chipM');
const chipAns  = document.getElementById('chipAns');
const chipAngle= document.getElementById('chipAngle');

let cur = '0', expr = '', mem = 0, ans = 0;
let newNum = true, hasDot = false, useDeg = true;
let op = null, fv = null;

function toRad(x){ return useDeg ? x*Math.PI/180 : x; }

function fmt(n){
  if(!isFinite(n)||isNaN(n)) return 'ERROR';
  if(Math.abs(n)>=1e13||(Math.abs(n)<1e-9&&n!==0)) return n.toExponential(5);
  return parseFloat(n.toPrecision(12)).toString();
}

function setRes(v, err){
  resultEl.textContent = v;
  resultEl.classList.toggle('err', !!err);
  resultEl.classList.add('flash');
  setTimeout(()=>resultEl.classList.remove('flash'), 200);
}

function setStat(msg, mode){
  statusEl.textContent = msg;
  if(mode) modeEl.textContent = mode;
  setTimeout(()=>statusEl.textContent='SYSTEM READY', 1800);
}

function updateChips(){
  chipM.textContent   = 'M: '+fmt(mem);
  chipM.classList.toggle('on', mem!==0);
  chipAns.textContent = 'ANS: '+fmt(ans);
  chipAngle.textContent = useDeg ? 'DEG' : 'RAD';
  chipAngle.classList.add('on');
}

function doCalc(){
  if(fv===null||op===null) return parseFloat(cur);
  const a=fv, b=parseFloat(cur);
  if(op==='+') return a+b;
  if(op==='−') return a-b;
  if(op==='×') return a*b;
  if(op==='÷') return b===0 ? NaN : a/b;
  return b;
}

function clearOp(){
  document.querySelectorAll('.btn.op').forEach(b=>b.classList.remove('active-op'));
}
function hiliteOp(o){
  clearOp();
  if(o) document.querySelectorAll('.btn.op').forEach(b=>{ if(b.dataset.a===o) b.classList.add('active-op'); });
}

function handle(a){
  // Digit
  if(/^[0-9]$/.test(a)){
    if(newNum){ cur=a; newNum=false; hasDot=false; }
    else if(cur.length<16) cur+=a;
    setRes(cur); modeEl.textContent='INPUT'; return;
  }
  // Dot
  if(a==='.'){
    if(newNum){ cur='0.'; newNum=false; hasDot=true; }
    else if(!hasDot){ cur+='.'; hasDot=true; }
    setRes(cur); return;
  }
  // Operators
  if(['+','−','×','÷'].includes(a)){
    fv = isNaN(doCalc()) ? parseFloat(cur) : doCalc();
    op = a; newNum=true; hasDot=false;
    expr = fmt(fv)+' '+a;
    exprEl.textContent = expr;
    hiliteOp(a); setStat('OPERATOR SET','OPER'); return;
  }
  // Equals
  if(a==='='){
    const r = doCalc();
    exprEl.textContent = (expr||cur)+' '+(newNum?'':cur)+' =';
    if(!isFinite(r)||isNaN(r)){ setRes('ERR',true); setStat('MATH ERROR','ERR'); }
    else{
      ans=r; cur=fmt(r);
      setRes(cur); setStat('COMPUTED','RES');
      modeEl.textContent='RES';
    }
    fv=null; op=null; newNum=true; hasDot=cur.includes('.'); hiliteOp(null);
    updateChips(); return;
  }
  // AC
  if(a==='AC'){
    cur='0'; expr=''; fv=null; op=null; newNum=true; hasDot=false;
    exprEl.innerHTML='&nbsp;'; setRes('0');
    hiliteOp(null); setStat('CLEARED','STD'); return;
  }
  // Backspace
  if(a==='back'){
    if(!newNum&&cur.length>1){
      if(cur.slice(-1)==='.') hasDot=false;
      cur=cur.slice(0,-1);
    } else { cur='0'; newNum=true; hasDot=false; }
    setRes(cur); return;
  }
  // Percent
  if(a==='%'){
    cur = fmt(parseFloat(cur)/100);
    hasDot=cur.includes('.'); setRes(cur); return;
  }
  // Parentheses
  if(a==='('||a===')'){
    expr+=a; exprEl.textContent=expr; return;
  }
  // Scientific
  const v=parseFloat(cur); let res;
  switch(a){
    case 'sin':  res=Math.sin(toRad(v));  setStat('SIN APPLIED','FUNC'); break;
    case 'cos':  res=Math.cos(toRad(v));  setStat('COS APPLIED','FUNC'); break;
    case 'tan':  res=Math.tan(toRad(v));  setStat('TAN APPLIED','FUNC'); break;
    case 'sqrt': res=Math.sqrt(v);         setStat('√ APPLIED','FUNC');  break;
    case 'log':  res=Math.log10(v);        setStat('LOG₁₀','FUNC'); break;
    case 'ln':   res=Math.log(v);          setStat('LN APPLIED','FUNC'); break;
    case 'pow2': res=v*v;                  setStat('x² APPLIED','FUNC'); break;
    case 'pi':   res=Math.PI; newNum=false; setStat('π INSERTED','FUNC'); break;
    default: return;
  }
  if(!isFinite(res)||isNaN(res)){ setRes('ERR',true); setStat('MATH ERROR','ERR'); return; }
  ans=res; cur=fmt(res); hasDot=cur.includes('.'); newNum=true;
  exprEl.textContent = a.toUpperCase()+'('+fmt(v)+') =';
  setRes(cur); updateChips();
}

function handleMem(a){
  if(a==='MC'){ mem=0; setStat('MEM CLEARED'); }
  if(a==='MR'){ cur=fmt(mem); hasDot=cur.includes('.'); newNum=true; setRes(cur); setStat('MEM RECALLED'); }
  if(a==='M+'){ mem+=parseFloat(cur); setStat('MEM STORED'); }
  updateChips();
}

// Angle toggle
chipAngle.style.cursor='pointer';
chipAngle.addEventListener('click',()=>{
  useDeg=!useDeg;
  setStat(useDeg?'MODE: DEGREE':'MODE: RADIAN');
  updateChips();
});

// Button delegation
document.getElementById('grid').addEventListener('click', e=>{
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const a = btn.dataset.a;
  if(['MC','MR','M+'].includes(a)) handleMem(a);
  else handle(a);
});

// Keyboard
document.addEventListener('keydown', e=>{
  const k=e.key;
  if(/^[0-9]$/.test(k)) handle(k);
  else if(k==='.') handle('.');
  else if(k==='+') handle('+');
  else if(k==='-') handle('−');
  else if(k==='*') handle('×');
  else if(k==='/'){ e.preventDefault(); handle('÷'); }
  else if(k==='Enter'||k==='=') handle('=');
  else if(k==='Backspace') handle('back');
  else if(k==='Escape') handle('AC');
  else if(k==='%') handle('%');
});

updateChips();
</script>
